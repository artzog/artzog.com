<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Project — Paul Zografakis</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gallery.css"></head><body><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Paul Zografakis</a><ul class="nav-menu"><li><a href="index.html">Works</a></li><li><a href="about.html">About</a></li><li><a href="archive.html" class="active">Archive</a></li><li><a href="contact.html">Contact</a></li></ul></div></nav><main class="gallery-page"><a class="gallery-back" href="archive.html">← All projects</a><header class="gallery-page-header"><h1 id="project-title"></h1><p id="project-subtitle"></p></header><div class="gallery-images" id="gallery-images"></div></main><div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Artwork image viewer"><button class="lightbox-close" aria-label="Close image viewer">×</button><button class="lightbox-prev" aria-label="Previous image">‹</button><img id="lightbox-image" alt=""><button class="lightbox-next" aria-label="Next image">›</button><p id="lightbox-counter"></p></div><footer class="gallery-footer">© Paul Zografakis. All rights reserved.</footer><script src="projects.js"></script><script>const slug=new URLSearchParams(location.search).get('project');const p=window.ARTZOG_PROJECTS.find(p=>p.slug===slug);const gallery=document.getElementById('gallery-images');const lightbox=document.getElementById('lightbox');const lightboxImg=document.getElementById('lightbox-image');let current=0;let lastFocus=null;if(!p){document.getElementById('project-title').textContent='Project not found';document.getElementById('project-subtitle').textContent='Return to the Archive to browse available projects.';}else{document.title=p.title+' — Paul Zografakis';document.getElementById('project-title').textContent=p.title;document.getElementById('project-subtitle').textContent=p.images.length+' photographs';p.images.forEach((im,i)=>{const b=document.createElement('button');b.className='gallery-image';b.type='button';b.setAttribute('aria-label','View image '+(i+1)+' of '+p.images.length);const image=document.createElement('img');image.src=im.src;image.alt=p.title+', photograph '+(i+1);image.loading=i<2?'eager':'lazy';image.decoding='async';b.append(image);b.onclick=()=>openLightbox(i);gallery.append(b)})}function openLightbox(i){lastFocus=document.activeElement;lightbox.hidden=false;document.body.classList.add('lightbox-open');show(i);document.querySelector('.lightbox-close').focus()}function show(i){current=(i+p.images.length)%p.images.length;lightboxImg.src=p.images[current].src;lightboxImg.alt=p.title+', photograph '+(current+1);document.getElementById('lightbox-counter').textContent=(current+1)+' / '+p.images.length}function closeLightbox(){lightbox.hidden=true;document.body.classList.remove('lightbox-open');if(lastFocus)lastFocus.focus()}document.querySelector('.lightbox-close').onclick=closeLightbox;document.querySelector('.lightbox-prev').onclick=()=>show(current-1);document.querySelector('.lightbox-next').onclick=()=>show(current+1);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});document.addEventListener('keydown',e=>{if(lightbox.hidden||!p)return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)})</script></body></html>
